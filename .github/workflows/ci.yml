name: MLflow CI Pipeline - Titanic Survival Prediction

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Jumlah estimator'
        required: false
        default: '100'
      max_depth:
        description: 'Max depth (0 = None)'
        required: false
        default: '10'
      max_features:
        description: 'Max features (sqrt atau log2)'
        required: false
        default: 'sqrt'

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.11.1 scikit-learn==1.4.0 pandas==2.2.0 \
                      numpy==1.26.4 matplotlib==3.8.2 seaborn==0.13.2 \
                      joblib==1.3.2

      - name: Run MLflow Project (Training)
        run: |
          cd MLProject
          mlflow run . \
            --no-conda \
            -P n_estimators=${{ github.event.inputs.n_estimators || '100' }} \
            -P max_depth=${{ github.event.inputs.max_depth || '10' }} \
            -P max_features=${{ github.event.inputs.max_features || 'sqrt' }}

      - name: Display Training Results
        run: |
          echo "=== Training Selesai ==="
          cat MLProject/run_id.txt
          ls -la MLProject/mlproject_artifacts/

      - name: Upload MLflow Artifacts to GitHub Actions
        uses: actions/upload-artifact@v3
        with:
          name: titanic-mlflow-artifacts-${{ github.run_number }}
          path: |
            MLProject/mlruns/
            MLProject/mlproject_artifacts/
            MLProject/run_id.txt

      - name: Commit Artifacts to Repository
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI Bot"
          mkdir -p saved_artifacts
          cp -r MLProject/mlproject_artifacts/* saved_artifacts/ 2>/dev/null || true
          cp MLProject/run_id.txt saved_artifacts/ 2>/dev/null || true
          echo "Run: ${{ github.run_number }} | Date: $(date)" > saved_artifacts/run_info.txt
          git add saved_artifacts/
          git diff --staged --quiet || \
            git commit -m "ci: save titanic training artifacts [run ${{ github.run_number }}] [skip ci]"
          git push

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image (mlflow models build-docker)
        run: |
          RUN_ID=$(cat MLProject/run_id.txt)
          echo "Run ID: $RUN_ID"
          MODEL_URI="MLProject/mlruns/0/${RUN_ID}/artifacts/model"
          mlflow models build-docker \
            -m "$MODEL_URI" \
            -n "${{ secrets.DOCKER_USERNAME }}/titanic-classifier" \
            --enable-mlserver

      - name: Push Docker Image to Docker Hub
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/titanic-classifier:latest \
                     ${{ secrets.DOCKER_USERNAME }}/titanic-classifier:run-${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/titanic-classifier:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/titanic-classifier:run-${{ github.run_number }}
          echo ""
          echo "Docker image berhasil di-push!"
          echo "URL: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/titanic-classifier"

      - name: Save Docker Hub Link
        run: |
          echo "https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/titanic-classifier" \
               > MLProject/Tautan_Docker_Hub.txt
          cat MLProject/Tautan_Docker_Hub.txt
